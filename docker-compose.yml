services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./.qdrant:/qdrant/storage

  bot:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DB_PATH: /app/data/nomus.db
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
    restart: unless-stopped

  api:
    build: .
    command: ["python", "-m", "nomus.api.main"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DB_PATH: /app/data/nomus.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  hf_cache:
